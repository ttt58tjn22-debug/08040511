@media(prefers-color-scheme:dark){:root{--bg:#121318}}
body{min-height:100vh;background:var(--bg);display:flex;justify-content:center;align-items:flex-start;padding:10px 0;overflow:auto;font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif}
#wrap{flex:none;position:relative}
#stage{width:417px;height:876px;transform-origin:top left;position:absolute;left:0;top:0}
.phone{width:417px;height:876px;background:#000;border-radius:66px;padding:12px;box-shadow:0 0 0 2px #3a3a3f,0 30px 70px rgba(0,0,0,.35)}
#phone{position:relative;width:100%;height:100%;border-radius:54px;overflow:hidden;background:#000}
.island{position:absolute;top:11px;left:50%;width:120px;height:35px;margin-left:-60px;border-radius:20px;background:#000;z-index:31}
.sb{position:absolute;top:0;left:0;right:0;height:54px;padding:18px 34px 0;display:flex;justify-content:space-between;font-weight:600;font-size:16px;z-index:30;color:#fff;pointer-events:none}
#phone[data-sb=d] .sb{color:#000}
.bar{position:absolute;bottom:0;left:50%;width:180px;height:26px;margin-left:-90px;z-index:40;cursor:pointer}
.bar::after{content:"";position:absolute;bottom:8px;left:20px;right:20px;height:5px;border-radius:3px;background:#fff}
#phone[data-sb=d] .bar::after{background:#000}
.home{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.22),rgba(0,0,0,.22)),var(--wp) center/cover #222;padding:78px 22px 0;color:#fff}
.hi{position:absolute;width:80px;margin-left:-40px;text-align:center;font-size:12px;line-height:1.2;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);cursor:pointer}
.ib{position:relative;width:60px;height:60px;margin:0 auto 6px}
.ib img{width:60px;height:60px;display:block;transition:transform .12s}
.hi:active img{transform:scale(.92)}
.bd{position:absolute;top:-10px;right:-10px;min-width:28px;height:28px;padding:0 8px;border-radius:14px;background:#ff3b30;color:#fff;font-size:15px;line-height:28px;font-weight:500;text-shadow:none;text-align:center}
.cal,.ph{width:60px;height:60px;border-radius:14px;background:#fff;color:#000;text-align:center;transition:transform .12s}
.hi:active .cal,.hi:active .ph{transform:scale(.92)}
.cal .cw{display:block;color:#ff3b30;font-size:11px;font-weight:700;padding-top:7px;line-height:1.2}
.cal .cd{display:block;font-size:32px;font-weight:300;line-height:1.05}
.ph{background:linear-gradient(160deg,#9a9aa2,#5c5c64);display:grid;place-items:center;font-size:28px}
.wx{position:absolute;left:20px;top:92px;width:175px;height:146px;border-radius:24px;background:linear-gradient(180deg,#272d63,#171a3d);color:#fff;padding:14px}
.wx b{font-size:15px}
.wx .t{font-size:58px;font-weight:300;line-height:1.05;margin-top:4px}
.wx .c{position:absolute;left:14px;bottom:12px;font-size:14px;line-height:1.3}
.wx .c span{display:block;font-size:20px}
.mw{position:absolute;left:199px;top:92px;width:175px;height:146px;border-radius:24px;background:linear-gradient(160deg,#ff5a70,#f92a43);color:#fff;padding:14px}
.mw .al{width:43px;height:43px;border-radius:6px;background:linear-gradient(135deg,#454b66,#1f2233);display:grid;place-items:center;font-size:9px;font-weight:700;letter-spacing:.5px}
.mw .nt{position:absolute;right:14px;top:8px;font-size:30px}
.mw .ti{position:absolute;left:14px;top:62px;right:10px;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mw .ar{position:absolute;left:14px;top:82px;font-size:15px;opacity:.78}
.mw .pb{position:absolute;left:14px;top:107px;height:26px;padding:0 11px;border-radius:13px;background:rgba(255,255,255,.25);font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px;cursor:pointer}
.wl{position:absolute;top:244px;width:80px;margin-left:-40px;text-align:center;font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.dk{position:absolute;left:20px;right:20px;top:742px;height:88px;border-radius:36px;background:rgba(255,255,255,.26);backdrop-filter:blur(24px)}
.app{position:absolute;inset:0;background:#fff;color:#000;transform:translateY(8%) scale(.9);opacity:0;pointer-events:none;transition:.28s;z-index:10;border-radius:54px;overflow:hidden}
.app.open{transform:none;opacity:1;pointer-events:auto}
.pg{position:absolute;inset:0;padding-top:54px;display:flex;flex-direction:column;background:#fff}
.thread{transform:translateX(100%);transition:.25s}
.t .thread{transform:none}
.list h1{font-size:30px;padding:8px 20px 10px}
.row{display:flex;gap:12px;padding:10px 20px;cursor:pointer;align-items:center}
.row:hover{background:rgba(0,0,0,.04)}
.av{width:46px;height:46px;border-radius:50%;background:#d8dbe2;display:grid;place-items:center;font-size:24px;flex:none}
.row b{display:block}
.row small{display:block;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.th{display:flex;align-items:center;gap:10px;padding:6px 14px 10px;border-bottom:1px solid rgba(0,0,0,.1);font-size:17px}
.back{background:none;border:0;font-size:34px;line-height:1;color:#0a84ff;cursor:pointer}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.b{max-width:75%;padding:9px 13px;border-radius:19px;font-size:16px;line-height:1.35;word-break:break-word;white-space:pre-wrap}
.me{align-self:flex-end}.you{align-self:flex-start}
.typing{opacity:.55}
#sms .me{background:#0a84ff;color:#fff}
#sms .you{background:#e9e9ee}

  home.appendChild(d);
}

/* 채팅 앱 (문자 / 카카오톡 공용) */
function chatApp(id, title, ph2){
  const el = $('#' + id), hist = {}; let cur = null;
  const P = D.contacts.filter(c => !c.only || c.only === id);
  P.forEach(c => hist[c.id] = [].concat(D.chat[c.id].first).map(t => ({me:false, t})));
  el.innerHTML = `<div class="pg list"><h1>${title}</h1><div class="rows"></div></div>
  <div class="pg thread"><div class="th"><button class="back" aria-label="뒤로">‹</button><b></b></div><div class="msgs"></div>
  <form class="in"><input placeholder="${ph2}" autocomplete="off"><button aria-label="보내기">↑</button></form></div>`;
  const rows = $('.rows', el), msgs = $('.msgs', el), inp = $('input', el);
  (window.chatPush = window.chatPush || {})[id] = (cid, text) => { hist[cid].push({me:false, t:text}); drawList(); if(cur === cid) draw(); };
  const drawList = () => rows.innerHTML = P.map(c => `<div class="row" data-id="${c.id}"><div class="av">${c.e}</div><div><b>${c.name}</b><small>${hist[c.id].at(-1).t}</small></div></div>`).join('');
  const draw = (typing) => {
    msgs.innerHTML = hist[cur].map(m => `<div class="b ${m.me ? 'me' : 'you'}"></div>`).join('') + (typing ? '<div class="b you typing">입력 중…</div>' : '');
    [...msgs.children].forEach((n, i) => { if(hist[cur][i]) n.textContent = hist[cur][i].t; });
    msgs.scrollTop = msgs.scrollHeight;
  };
  drawList();
  rows.onclick = e => { const r = e.target.closest('.row'); if(!r) return; cur = r.dataset.id; $('.th b', el).textContent = P.find(c => c.id === cur).name; draw(); el.classList.add('t'); };
  $('.back', el).onclick = () => { el.classList.remove('t'); drawList(); cur = null; };
  $('.in', el).onsubmit = async e => {
    e.preventDefault();
    const text = inp.value.trim(); if(!text || !cur) return;
    inp.value = ''; const who = cur, d = D.chat[who];
    hist[who].push({me:true, t:text}); draw();
    const low = text.toLowerCase();
    const rule = d.rules.find(r => r.k.some(k => low.includes(k.toLowerCase())));
    for(const line of (rule ? rule.r : [d.fb])){
      await wait(500); if(cur === who) draw(true);
      await wait(700 + line.length * 40);
      hist[who].push({me:false, t:line}); if(cur === who) draw();
    }
  };
}

  if(!bd){ ib.insertAdjacentHTML('beforeend', '<b class="bd"></b>'); bd = $('.bd', ib); }
  bd.textContent = n;
}

    ['m','더보기','<svg viewBox="0 0 26 26"><circle cx="5" cy="13" r="2.2"/><circle cx="13" cy="13" r="2.2"/><circle cx="21" cy="13" r="2.2"/></svg>']
  ];
  const hd = (title, icons) => '<div class="kk-h"><button class="kk-bk" aria-label="홈">‹</button><h2>' + title + '</h2>' + icons.map(i => I[i]).join('') + '</div>';
  el.innerHTML =
    '<div class="kk-page on" id="kf">' + hd('친구', ['search','add','gear']) + '<div class="kk-list" id="kfl"></div></div>' +
    '<div class="kk-page" id="kc">' + hd('채팅', ['search','chat','gear']) + '<div class="kk-list" id="kcl"></div></div>' +
    '<div class="kk-tabs">' + TABS.map(t => '<div class="kk-tab' + (t[0] === 'f' ? ' on' : '') + '" data-t="' + t[0] + '">' + t[2] + t[1] + '</div>').join('') + '</div>' +
    '<div class="kk-room" id="kr"><div class="kk-rh"><button class="kk-bk" id="krb" aria-label="뒤로">‹</button><h3 id="krn"></h3>' + I.search + I.menu + '</div><div class="kk-rm" id="krm"></div>' +
    '<form class="kk-ri" id="kri"><span class="kk-pl">+</span><input autocomplete="off" aria-label="메시지 입력"><button class="kk-sd" aria-label="보내기">↑</button></form></div>' +
    '<div class="kk-prof" id="kp"><button class="kk-x" id="kpx" aria-label="닫기">✕</button><div class="kk-big">' + AVS + '</div><h3 id="kpn"></h3><button class="kk-go" id="kpc">💬 1:1 채팅</button></div>';

  const now = Date.now();
  const rooms = K.rooms.map(r => ({name:r.name, unread:r.unread || 0, msgs:r.msgs.map(t => ({me:false, t, ts:new Date(now - (r.ago || 0) * 60000)}))}));
  let cur = null;
  const hm = d => (d.getHours() < 12 ? '오전 ' : '오후 ') + (d.getHours() % 12 || 12) + ':' + String(d.getMinutes()).padStart(2, '0');
  const dayKey = d => d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
  const listTime = d => { const n = new Date(); if(dayKey(d) === dayKey(n)) return hm(d); if(dayKey(d) === dayKey(new Date(n.getTime() - 864e5))) return '어제'; return (d.getMonth() + 1) + '월 ' + d.getDate() + '일'; };
  const esc = t => t.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const find = n => rooms.find(x => x.name === n);
  const bump = r => { rooms.splice(rooms.indexOf(r), 1); rooms.unshift(r); };
  const isOpen = () => $('#kr').classList.contains('on') && el.classList.contains('open');
  const sync = () => setBadge('kakao', rooms.reduce((a, r) => a + r.unread, 0));

  const renderF = () => {
    const names = [...K.friends].sort((a, b) => a.localeCompare(b, 'ko'));
    $('#kfl').innerHTML = '<div class="kk-row" data-me="1">' + AV + '<b class="kk-nm">' + esc(K.me) + '</b></div><div class="kk-hr"></div><div class="kk-sec">친구 ' + names.length + '</div>' +
      names.map(n => '<div class="kk-row" data-n="' + esc(n) + '">' + AV + '<b class="kk-nm">' + esc(n) + '</b></div>').join('');
  };
  const renderC = () => {
    $('#kcl').innerHTML = rooms.map(r => { const l = r.msgs[r.msgs.length - 1];
      return '<div class="kk-cr" data-n="' + esc(r.name) + '">' + AV + '<div class="kk-mid"><b class="kk-nm">' + esc(r.name) + '</b><div class="kk-pv">' + esc(l.t) + '</div></div><div class="kk-rt"><span>' + listTime(l.ts) + '</span>' + (r.unread ? '<i class="kk-un">' + r.unread + '</i>' : '') + '</div></div>'; }).join('');
  };
  const renderR = () => {
    if(!cur) return;
    let html = '', lastDay = '', prev = null;
    cur.msgs.forEach(m => {
      const k = dayKey(m.ts), same = prev && prev.me === m.me && k === lastDay;
      if(k !== lastDay){ lastDay = k; html += '<div class="kk-dv">' + m.ts.toLocaleDateString('ko-KR', {year:'numeric', month:'long', day:'numeric', weekday:'long'}) + '</div>'; }
      html += m.me
        ? '<div class="kk-mr kk-me"><span class="kk-tm">' + hm(m.ts) + '</span><div class="kk-bub"></div></div>'
        : '<div class="kk-mr kk-you">' + (same ? '<span class="kk-sp"></span>' : AV) + '<div>' + (same ? '' : '<div class="kk-n2">' + esc(cur.name) + '</div>') + '<div class="kk-line"><div class="kk-bub"></div><span class="kk-tm">' + hm(m.ts) + '</span></div></div></div>';
      prev = m;
    });
    const box = $('#krm'); box.innerHTML = html;
    box.querySelectorAll('.kk-bub').forEach((b, i) => b.textContent = cur.msgs[i].t);
    box.scrollTop = box.scrollHeight;
  };
  const setTab = t => {
    $('#kf').classList.toggle('on', t === 'f'); $('#kc').classList.toggle('on', t === 'c');
    el.querySelectorAll('.kk-tab').forEach(b => b.classList.toggle('on', b.dataset.t === t));
    if(t === 'c') renderC();
  };
  const open = n => {
    cur = find(n) || {name:n, unread:0, msgs:[]};
    cur.unread = 0; $('#krn').textContent = n; renderR(); $('#kr').classList.add('on'); sync(); renderC();
  };
  const receive = (name, t) => {
    let r = find(name); if(!r){ r = {name, unread:0, msgs:[]}; rooms.unshift(r); }
    r.msgs.push({me:false, t, ts:new Date()}); bump(r);
    if(!(cur === r && isOpen())) r.unread++;
    sync(); renderC(); if(cur === r) renderR();
  };

  el.addEventListener('click', e => {
    if(e.target.closest('.kk-h .kk-bk')) return show(null);
    if(e.target.closest('.kk-h svg, .kk-rh svg')) toast('아직 준비 중이에요');
  });
  el.querySelector('.kk-tabs').onclick = e => {
    const b = e.target.closest('.kk-tab'); if(!b) return;
    const t = b.dataset.t; (t === 'f' || t === 'c') ? setTab(t) : toast(b.textContent.trim() + ' 탭은 아직 준비 중이에요');
  };
  $('#kfl').onclick = e => {
    const r = e.target.closest('.kk-row'); if(!r) return;
    const n = r.dataset.me ? K.me : r.dataset.n;
    $('#kpn').textContent = n; $('#kp').dataset.n = n; $('#kpc').style.display = r.dataset.me ? 'none' : '';
    $('#kp').classList.add('on'); ph.dataset.sb = 'l';
  };
  $('#kpx').onclick = () => { $('#kp').classList.remove('on'); ph.dataset.sb = 'd'; };
  $('#kpc').onclick = () => { $('#kp').classList.remove('on'); ph.dataset.sb = 'd'; setTab('c'); open($('#kp').dataset.n); };
  $('#kcl').onclick = e => { const r = e.target.closest('.kk-cr'); if(r) open(r.dataset.n); };
  $('#krb').onclick = () => { $('#kr').classList.remove('on'); renderC(); };
  $('#kri').onsubmit = async e => {
    e.preventDefault();
    const inp = $('#kri input'), text = inp.value.trim(); if(!text || !cur) return;
    inp.value = ''; const r = cur;
    if(!rooms.includes(r)) rooms.unshift(r);
    r.msgs.push({me:true, t:text, ts:new Date()}); bump(r); renderR(); renderC();
    const cfg = K.replies[r.name] || {rules:[], fb:'응?'}, low = text.toLowerCase();
    const rule = cfg.rules.find(x => x.k.some(k => low.includes(k.toLowerCase())));
    for(const line of (rule ? rule.r : [cfg.fb])){
      await wait(700 + line.length * 40);
      r.msgs.push({me:false, t:line, ts:new Date()}); bump(r);
      if(cur === r && isOpen()) renderR(); else { r.unread++; sync(); }
      renderC();
    }
  };
  window.kakaoReceive = receive;
  window.kakaoOpen = n => { $('#kp').classList.remove('on'); setTab('c'); open(n); };
  renderF(); renderC(); sync();
}
kakaoApp();
setBadge('tel', 1);

      dots.innerHTML = p.imgs.map((_, i) => '<i' + (i ? '' : ' class="on"') + '></i>').join('');
      car.addEventListener('scroll', () => { const k = Math.round(car.scrollLeft / car.clientWidth); [...dots.children].forEach((x, i) => x.classList.toggle('on', i === k)); });
      let dx = null, sl = 0;
      const scale = () => $('#stage').getBoundingClientRect().width / 417;
      car.addEventListener('pointerdown', e => { if(e.pointerType !== 'mouse') return; dx = e.clientX; sl = car.scrollLeft; car.style.scrollSnapType = 'none'; car.setPointerCapture(e.pointerId); });
      car.addEventListener('pointermove', e => { if(dx !== null) car.scrollLeft = sl - (e.clientX - dx) / scale(); });
      const end = () => { if(dx === null) return; dx = null; const w = car.clientWidth, i = Math.round(car.scrollLeft / w); car.style.scrollSnapType = ''; car.scrollTo({left: i * w, behavior:'smooth'}); };
      car.addEventListener('pointerup', end); car.addEventListener('pointercancel', end);
    }
    feed.appendChild(d);
  });

  /* 댓글 시트 */
  const cs = $('#igcs');
  const openComments = p => {
    $('#igcl').innerHTML = p.list.map(c => '<div class="ig-cm">' + avHtml(c.u) + '<div class="ig-cx"><b>' + esc(c.u) + '</b><span class="ago">' + esc(c.ago) + '</span><div>' + esc(c.t) + '</div></div><div class="lk">' + S.heart + esc(c.lk) + '</div></div>').join('');
    $('#igcl').scrollTop = 0; cs.classList.add('on');
  };
  $('#igcb').onclick = () => cs.classList.remove('on');
  $('.ig-ci input', cs).onclick = () => toast('댓글 작성은 아직 준비 중이에요');

  /* 스토리 */
  const vid = $('#igsvd'), hint = $('#igsh');
  let si = -1, tm = null, moved = 0, sx = null, ssl = 0;
  const stageScale = () => $('#stage').getBoundingClientRect().width / 417;
  st.addEventListener('pointerdown', e => { if(e.pointerType !== 'mouse') return; sx = e.clientX; ssl = st.scrollLeft; moved = 0; });
  window.addEventListener('pointermove', e => { if(sx === null) return; const dx = e.clientX - sx; moved = Math.max(moved, Math.abs(dx)); st.scrollLeft = ssl - dx / stageScale(); });
  window.addEventListener('pointerup', () => { sx = null; });
  const stopVid = () => { vid.onended = null; vid.ontimeupdate = null; vid.pause(); hint.style.display = 'none'; };
  const closeStory = () => {
    clearTimeout(tm); stopVid(); $('#igsv').classList.remove('on');
    if(el.classList.contains('open')) ph.dataset.sb = 'd';
  };
  window.igStop = closeStory;
  const openStory = i => {
    clearTimeout(tm); stopVid();
    if(i >= G.stories.length) return closeStory();
    si = i; const u = G.stories[i], info = (G.storyInfo || {})[u] || {};
    $('#igsa').src = AVS[u]; $('#igsn').textContent = u; $('#igst2').textContent = info.time || '지금';
    const bar = $('#igpb'); bar.style.transition = 'none'; bar.style.width = '0'; void bar.offsetWidth;
    $('#igsv').classList.add('on'); ph.dataset.sb = 'l';
    const ring = $('.ig-it[data-i="' + i + '"] .ig-ring', el); if(ring) ring.classList.add('seen');
    if(info.video){
      $('#igsi').style.display = 'none'; vid.style.display = 'block';
      vid.muted = false; vid.src = info.video;
      vid.ontimeupdate = () => { if(vid.duration) bar.style.width = (vid.currentTime / vid.duration * 100) + '%'; };
      vid.onended = () => openStory(i + 1);
      const pr = vid.play();
      if(pr && pr.catch) pr.catch(() => { vid.muted = true; hint.style.display = 'block'; vid.play().catch(() => {}); });
    } else {
      vid.style.display = 'none'; $('#igsi').style.display = 'block'; $('#igsi').src = AVS[u];
      bar.style.transition = 'width 5s linear'; bar.style.width = '100%';
      tm = setTimeout(() => openStory(i + 1), 5000);
    }
  };
  st.onclick = e => {
    if(moved > 6){ moved = 0; return; }
    const it = e.target.closest('.ig-it'); if(!it) return;
    it.dataset.i !== undefined ? openStory(+it.dataset.i) : toast('스토리 올리기는 아직 준비 중이에요');
  };
  $('#igsi').onclick = () => openStory(si + 1);
  vid.onclick = () => { if(vid.muted){ vid.muted = false; hint.style.display = 'none'; } else openStory(si + 1); };
  $('#igsx').onclick = closeStory;

  el.addEventListener('click', e => {
    const post = e.target.closest('.ig-post');
    const h = e.target.closest('.hrt'); if(h){ h.classList.toggle('on'); return; }
    const b = e.target.closest('.bk'); if(b){ const q = $('path', b); q.style.fill = q.style.fill ? '' : '#111'; return; }
    if(post && e.target.closest('.cm')){ openComments(G.posts[+post.dataset.p]); return; }
    if(e.target.closest('.ig-nb:not(.on), .ig-fb, .ig-sh a, .ig-top svg, .ig-ph>svg, .ig-ac .a:not(.hrt):not(.cm):not(.bk)')) toast('아직 준비 중이에요');
  });
}
instaApp();

/* 전화 앱 */
let digits = '';
const fmt = d => d.length > 7 ? d.replace(/(\d{3})(\d{4})(\d+)/, '$1-$2-$3') : d.length > 3 ? d.replace(/(\d{3})(\d+)/, '$1-$2') : d;
const upd = () => $('#num').textContent = fmt(digits);
$('#chips').innerHTML = D.contacts.filter(c => !c.only).map(c => `<div class="chip" data-n="${norm(c.num)}">${c.e} ${c.name}</div>`).join('');
$('#chips').onclick = e => { const c = e.target.closest('.chip'); if(c){ digits = c.dataset.n; upd(); } };
$('#pad').innerHTML = '123456789*0#'.split('').map(k => `<button class="k" data-k="${k}">${k}</button>`).join('') + '<span></span><button class="k go" data-k="go" aria-label="전화 걸기">📞</button><button class="k del" data-k="del" aria-label="지우기">⌫</button>';
$('#pad').onclick = e => {
  const b = e.target.closest('.k'); if(!b) return; const k = b.dataset.k;
  if(k === 'go') return dial();
  if(k === 'del') digits = digits.slice(0, -1); else if(digits.length < 11) digits += k;
  upd();
};

/* 통화 */
let callId = 0, timer;
function dial(){
  const d = norm(digits); if(!d) return toast('번호를 입력하세요');
  const c = D.contacts.find(c => norm(c.num) === d);
  const lines = D.calls[d] || [D.noNumber];
  const who = c ? c.name : '안내';
  const id = ++callId; let sec = 0;
  $('#cav').textContent = c ? c.e : '👤';
  $('#cn').textContent = c ? c.name : fmt(d);
  $('#cs').textContent = '전화 거는 중…'; $('#sub').innerHTML = '';
  show('call');
  (async () => {
    await wait(2000); if(id !== callId) return;
    $('#cs').textContent = '00:00';
    timer = setInterval(() => { sec++; $('#cs').textContent = String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0'); }, 1000);
    for(const l of lines){
      const s = $('#sub'); s.innerHTML = '<small></small><span></span>';
      $('small', s).textContent = who; $('span', s).textContent = l;
      await wait(3200); if(id !== callId) return;
    }
    endCall();
  })();
}
function endCall(silent){
  if(!$('#call').classList.contains('open')) return;
  callId++; clearInterval(timer);
  $('#cs').textContent = '통화 종료';
  if(!silent) setTimeout(() => { if($('#call').classList.contains('open')) show('tel'); }, 900);
}
$('#end').onclick = () => endCall();

/* 잠금화면 */
let locked = true, entry = '';
const lock = $('#lock'), front = $('#front'), pass = $('#pass'), dots = $('#dots');
const hm = d => String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
D.notifs.forEach(n => {
  const c = document.createElement('div'); c.className = 'nc'; c.innerHTML = '<i></i><b></b><em></em><small></small>';
  { const im = document.createElement('img'); im.src = IC[n.k]; im.alt = ''; $('i', c).appendChild(im); }
  $('b', c).textContent = n.title; if(n.tc) $('b', c).style.color = n.tc;
  $('small', c).textContent = n.body;
  $('em', c).textContent = n.ago != null ? hm(new Date(Date.now() - n.ago * 60000)) : n.when;
  $('#nt').appendChild(c);
});
tick();
const sc = () => $('#stage').getBoundingClientRect().width / 417;
let y0 = null;
front.addEventListener('pointerdown', e => { y0 = e.clientY; front.classList.add('drag'); front.setPointerCapture(e.pointerId); });
front.addEventListener('pointermove', e => { if(y0 === null) return; front.style.transform = `translateY(${Math.min(0, (e.clientY - y0) / sc())}px)`; });
front.addEventListener('pointerup', e => {
  if(y0 === null) return;
  const dy = (e.clientY - y0) / sc(); y0 = null;
  front.classList.remove('drag'); front.style.transform = '';
  if(dy < -90 || Math.abs(dy) < 6) front.classList.add('up');
});
front.addEventListener('pointercancel', () => { y0 = null; front.classList.remove('drag'); front.style.transform = ''; });
$('#pk').innerHTML = [['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['0','']]
  .map(([n, l]) => `<button data-n="${n}" class="${n === '0' ? 'z' : ''}">${n}${l ? '<small>' + l + '</small>' : ''}</button>`).join('');
const drawDots = () => [...dots.children].forEach((d, i) => d.classList.toggle('on', i < entry.length));
$('#pk').onclick = e => {
  const b = e.target.closest('button'); if(!b || entry.length >= 4) return;
  entry += b.dataset.n; drawDots();
  if(entry.length < 4) return;
  setTimeout(() => {
    if(entry === D.passcode){
      locked = false; pass.classList.add('out');
      setTimeout(() => lock.classList.add('gone'), 320);
      setTimeout(incoming, 1300);
    } else {
      $('#pt').textContent = '암호가 맞지 않아요'; dots.classList.add('shake');
      setTimeout(() => { entry = ''; drawDots(); dots.classList.remove('shake'); $('#pt').textContent = '암호 입력'; }, 600);
    }
  }, 150);
};
$('#pcancel').onclick = () => { front.classList.remove('up'); entry = ''; drawDots(); };
$('#emg').onclick = () => toast('긴급 구조는 지원하지 않아요');

/* 잠금 해제 후 카톡 배너 */
function banner(title, body){
  return new Promise(res => {
    const b = document.createElement('div'); b.className = 'bn';
    b.innerHTML = '<img alt=""><div><b></b><span></span></div><em>지금</em>';
    $('img', b).src = IC.kakao; $('b', b).textContent = title; $('span', b).textContent = body;
    let done = false; const fin = () => { if(!done){ done = true; res(); } };
    b.onclick = () => { b.remove(); show('kakao'); window.kakaoOpen('치치'); fin(); };
    ph.appendChild(b);
    requestAnimationFrame(() => requestAnimationFrame(() => b.classList.add('in')));
    setTimeout(() => { b.classList.remove('in'); setTimeout(() => { b.remove(); fin(); }, 450); }, 3300);
  });
}
async function incoming(){
  for(const t of ['지금 어디예요?', '시온이 형 연락 봐주세요...']){
    window.kakaoReceive('치치', t);
    await banner('치치', t);
    await wait(400);
  }
}

/* 화면 크기에 맞춰 폰 축소 */
function fit(){
  const small = innerWidth < 600;
  let h = Math.min(innerHeight, document.documentElement.clientHeight, window.visualViewport ? visualViewport.height : 1e5);
  if(small) h = Math.min(h, screen.height * 0.74);
  const s = Math.min(1, (h - 24) / 876, (innerWidth - 8) / 417);
  $('#stage').style.transform = `scale(${s})`;
  $('#wrap').style.width = 417 * s + 'px'; $('#wrap').style.height = 876 * s + 'px';
  document.body.style.alignItems = small ? 'flex-start' : 'center';
}
fit(); addEventListener('resize', fit);
